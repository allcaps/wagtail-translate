[tox]
skipsdist = True
usedevelop = True

envlist =
    python{3.10,3.11,3.12}-django{4.2}-wagtail{7.0}-{sqlite}
    python{3.10,3.11,3.12,3.13}-django{5.1}-wagtail{7.0}-{sqlite}
    python{3.10,3.11,3.12,3.13,3.14}-django{5.2}-wagtail{7.3,7.4}-{sqlite}
    python{3.12,3.13,3.14}-django{6.0}-wagtail{7.4}-{sqlite}

[gh-actions]
python =
    3.10: python3.10
    3.11: python3.11
    3.12: python3.12
    3.13: python3.13
    3.14: python3.14

[gh-actions:env]
DB =
    sqlite: sqlite

[testenv]
install_command = pip install -e ".[testing]" -U {opts} {packages}
commands = pytest --cov {posargs: -vv}

basepython =
    python3.10: python3.10
    python3.11: python3.11
    python3.12: python3.12
    python3.13: python3.13
    python3.14: python3.14

deps =
    coverage

    django4.2: Django>=4.2,<4.3
    django5.1: Django>=5.1,<5.2
    django5.2: Django>=5.2,<5.3
    django6.0: Django>=6.0,<6.1

    wagtail7.0: wagtail>=7.0,<7.1
    wagtail7.3: wagtail>=7.3,<7.4
    wagtail7.4: wagtail>=7.4,<7.5


[testenv:llm]
basepython = python3.13
install_command = pip install -e ".[testing,llm]" -U {opts} {packages}
deps =
    coverage
    Django>=5.2,<5.3
    wagtail>=7.4,<7.5
commands = pytest --cov=wagtail_translate tests/test_llm_translator.py tests/test_llm_optional_dependency.py -vv


[testenv:interactive]
basepython = python3.14
install_command = pip install -e ".[testing,ollama]" -U {opts} {packages}

commands_pre =
    python {toxinidir}/manage.py makemigrations
    python {toxinidir}/manage.py migrate
    python {toxinidir}/manage.py shell -c "from django.contrib.auth.models import User;(not User.objects.filter(username='admin').exists()) and User.objects.create_superuser('admin', 'super@example.com', 'changeme')"
    python {toxinidir}/manage.py createcachetable

commands =
    {posargs:python manage.py runserver}

setenv =
    INTERACTIVE = 1
    OLLAMA_BASE_URL = http://localhost:11434/v1
