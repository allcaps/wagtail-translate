[project]
name = "wagtail-translate"
version = "1.0.0"
authors = [{ name = "Coen van der Kamp", email = "coen@fourdigits.nl" }]
description = "Use Wagtail Translate to machine translate your Wagtail contents."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wagtail",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.optional-dependencies]
test = [
    "djlint",
    "pytest",
    "pytest-django",
    "ruff",
    "wagtail-factories>=4.5.0",
]
llm = [
    "openai>=2.0.0",
]
deepl = [
    "deepl>=1.16.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.testproject.settings"
addopts = [
    "-ra",
]
pythonpath = [
    "src",
    ".",
]
testpaths = [
    "tests",
]

[tool.djlint]
profile = "django"
blank_line_after_tag = "load,extends,include,endblock"
indent = 2
extend_exclude = ".venv,.pytest_cache,.ruff_cache,build,dist,htmlcov"

[tool.ruff]
line-length = 88
src = [
    "src",
    "tests",
]
exclude = [
    ".venv",
    "**/migrations/*.py",
]

[tool.ruff.lint]
extend-select = [
    "I",
    "T10",
    "DJ",
    "ERA",
    "C90",
    "S",
    "N",
]
ignore = [
    "C901",
]

[tool.ruff.lint.isort]
known-first-party = [
    "wagtail_translate",
]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.per-file-ignores]
"*/test_*.py" = [
    "S101",
]
"tests/conftest.py" = [
    "S101",
]
"tests/testproject/demoapp/models.py" = [
    "ERA001",
]
"tests/testproject/settings.py" = [
    "ERA001",
]

[project.urls]
Documentation = "https://github.com/allcaps/wagtail-translate"
Changelog = "https://github.com/allcaps/wagtail-translate/releases"
Issues = "https://github.com/allcaps/wagtail-translate/issues"
Source = "https://github.com/allcaps/wagtail-translate"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
